name: Windows tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Unit and installer tests (no model calls)
        shell: pwsh
        run: |
          $env:CODEX_EXECUTOR_TEST_ROOT = Join-Path $env:RUNNER_TEMP 'codex-bridge-tests'
          $env:CODEX_EXECUTOR_PWSH = (Get-Command pwsh.exe).Source
          npm test
