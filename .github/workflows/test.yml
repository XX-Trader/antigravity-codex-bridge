name: Windows tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Unit and installer tests (no model calls)
        shell: pwsh
        run: |
          $env:CODEX_EXECUTOR_TEST_ROOT = Join-Path $env:RUNNER_TEMP 'codex-bridge-tests'
          $env:CODEX_EXECUTOR_PWSH = (Get-Command pwsh.exe).Source
          npm test
